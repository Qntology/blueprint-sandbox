[package]
name = "blueprint-app"
version = "0.1.0"
edition = "2021"
description = "blueprint 발전소 관제 앱: 주제어실(MCR) 통합 관제 콘솔과 현장 순시 · 정비 단말"
license = "Apache-2.0"

[lib]
name = "blueprint_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["vulkan"]
vulkan = ["blueprint-core/vulkan"]
rocm = ["blueprint-core/rocm"]
cuda = ["blueprint-core/cuda"]
metal = ["blueprint-core/metal"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
candle-core = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# 진단 로직은 코어가 맡습니다. GPU 백엔드는 앱의 기능으로 고릅니다.
blueprint-core = { path = "../../core", default-features = false, features = ["stanza"] }
blueprint-models = { path = "../../tools/model-settings" }
